[workspace]
members = ["crates/core", "crates/providers", "crates/windows", "crates/storage", "crates/app"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
hb-core = { path = "crates/core" }
hb-providers = { path = "crates/providers" }
hb-windows = { path = "crates/windows" }
hb-storage = { path = "crates/storage" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
crossbeam-channel = "0.5.15"
hidapi = { version = "2.6.7", default-features = false }
rusqlite = { version = "0.40.2", features = ["bundled"] }
windows = { version = "0.61.3", features = ["Foundation", "Foundation_Collections", "Devices_Bluetooth", "Devices_Enumeration", "Gaming_Input", "Devices_Power", "System_Power", "Win32_Foundation", "Win32_Security", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_HumanInterfaceDevice", "Win32_Devices_Properties", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_DirectWrite", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_ProcessStatus", "Win32_System_Power", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_UI_HiDpi", "Win32_UI_Accessibility", "Win32_UI_Input_XboxController", "Win32_UI_Input_KeyboardAndMouse"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
